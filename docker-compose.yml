services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      # Name-free, so no product rename reaches it (task-288). No fixed container
      # name: Compose names it per checkout, which keeps it unique on the machine.
      POSTGRES_DB: app
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: