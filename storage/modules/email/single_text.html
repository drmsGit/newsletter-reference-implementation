              <tr>

         style="font-family:{{ profile.font_family or 'Arial, Helvetica, sans-serif' }};font-size:{{ profile.size_body or '16px' }};line-height:1.6;text-align:left;color:{{ profile.colour_body_text or '#444444' }};"
      ><h3 style="margin:0;font-size:20px;line-height:1.25;color:{{ profile.colour_text or '#1a1a1a' }}">{{ headline_medium }}</h3></div>

              </tr>
            {% endif %}{% if body_long %}
              <tr>
                <td
                   align="left" style="font-size:0px;padding:0 0 12px 0;word-break:break-word;"
                >
                  
      <div
         style="font-family:{{ profile.font_family or 'Arial, Helvetica, sans-serif' }};font-size:{{ profile.size_body or '16px' }};line-height:1.6;text-align:left;color:{{ profile.colour_body_text or '#444444' }};"
      >{{ body_long }}</div>
    
                </td>
              </tr>
            {% endif %}{% if button_label and button_url %}
              <tr>
                <td
                   align="left" style="font-size:0px;padding:4px 0 0 0;word-break:break-word;"
                >
                  
      <div
         style="font-family:{{ profile.font_family or 'Arial, Helvetica, sans-serif' }};font-size:{{ profile.size_body or '16px' }};line-height:1.6;text-align:left;color:{{ profile.colour_body_text or '#444444' }};"
      ><a href="{{ button_url }}" class="text-link" style="color:{{ profile.colour_text or '#1a1a1a' }};text-decoration:underline;font-weight:600">{{ button_label }}&nbsp;&rarr;</a></div>
    
                </td>
              </tr>
