# Continuous integration (ADR-190, task-105).
#
# Blocks on defects, reports style. What fails a run:
#   - the backend suite, the client's type check, build and tests;
#   - Ruff's and ESLint's small blocking rule sets (backend/ruff.toml,
#     frontend/eslint.config.js) — everything else they find is reported only;
#   - the API contract: client types regenerated from the backend's schema
#     must equal frontend/src/api/schema.d.ts;
#   - an installed package that is not the locked one (check_installed.py);
#   - a known vulnerability in what ships (runtime Python lock, the client's
#     dependencies) — dev tooling is reported only;
#   - a secret in the git history.
# Weekly as well as on push, so a newly published vulnerability is noticed
# when nobody pushes. Third-party actions are pinned to commit SHAs and the
# scanner image to a digest (the tag each was taken from is in the comment), so
# a moved tag cannot change what runs here; tests/test_ci_workflow.py holds it.

name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older run for the same ref. The scheduled run gets a
# group of its own: every push lands on main, so sharing one let a push cancel
# the weekly scan, the run that exists for weeks without pushes (task-332).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend — lint, tests, schema, audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The app's database (the schema export imports the app), and the
      # suite's own, which conftest.py creates and reseeds.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_ci_test
      # The first admin the app creates in an empty user table, as a local
      # .env names one. Without it, tests that act as an admin skip in CI —
      # brand scoping and the audit log among them (found 2026-10-08).
      INITIAL_ADMIN_EMAIL: ci-admin@example.invalid
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install from the locks, hashes checked (ADR-189)
        run: |
          python -m venv venv
          venv/bin/pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Ruff — blocking rules
        run: venv/bin/ruff check .
      - name: Ruff — everything else, reported only
        run: venv/bin/ruff check --select E,F,W,B,I,UP,SIM --exit-zero --output-format concise .
      - name: Tests
        run: venv/bin/python -m pytest -q -p no:warnings -rs
      - name: Write the API schema for the contract check
        run: venv/bin/python scripts/export_openapi.py openapi.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: openapi
          path: backend/openapi.json
          retention-days: 7
      - name: Known vulnerabilities — what ships (blocking)
        run: venv/bin/pip-audit -r requirements.txt --require-hashes --disable-pip --progress-spinner off
      - name: Known vulnerabilities — dev tools (reported only)
        continue-on-error: true
        run: venv/bin/pip-audit -r requirements-dev.txt --require-hashes --disable-pip --progress-spinner off

  frontend:
    name: Client — lint, types, build, tests, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from the lock
        run: npm ci
      - name: ESLint — errors block, warnings are reported
        run: npm run lint
      - name: Type check and build
        run: npm run build
      - name: Email blocks compiled from their MJML (ADR-131 addendum 2026-10-15)
        run: npm run build:modules -- --check
      - name: Tests
        run: npm test
      - name: Known vulnerabilities — what ships (blocking)
        run: npm audit --omit=dev
      - name: Known vulnerabilities — dev tools (reported only)
        continue-on-error: true
        run: npm audit

  contract-and-installs:
    name: API contract and installed packages
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install both from their locks
        run: |
          python -m venv backend/venv
          backend/venv/bin/pip install --require-hashes -r backend/requirements.txt -r backend/requirements-dev.txt
          npm ci --prefix frontend
      - name: Every installed package is the locked one (task-236)
        run: backend/venv/bin/python backend/scripts/check_installed.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: openapi
          path: frontend
      - name: Client types match the API (ADR-170 point 5)
        working-directory: frontend
        run: |
          npx openapi-typescript openapi.json -o src/api/schema.d.ts
          git diff --exit-code -- src/api/schema.d.ts

  secrets:
    name: Secrets in the history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks — the whole history, redacted
        # The container image rather than gitleaks-action, which needs a paid
        # licence on organisation accounts. Same version as the local scan.
        # Pinned by digest like the actions above, so a moved tag cannot change
        # the one step that reads the whole history (task-332). Tag: v8.30.1.
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
