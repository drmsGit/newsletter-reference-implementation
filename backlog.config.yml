project_name: "Omnichannel Orchestration Reference"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Blocked", "Done"]
labels: ["needs-adr", "backend", "frontend", "docs"]
priorities: ["P0", "P1", "P2", "P3", "Parked"]
types: ["bug", "feature", "chore", "docs", "decision"]
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: false
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "task"
backlog_directory: "docs/queue"
